title: Page
tabs:
  main:
    display: Page
    sections:
      -
        display: Content
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: excerpt
            field:
              type: textarea
              display: Excerpt
              instructions: Short intro. Optional.
      -
        display: Theme sections
        instructions: Every marketing page uses the same Page template. Add any section here and drag to reorder. Collection details keep dedicated templates.
        fields:
          -
            import: all_page_builder
      -
        display: Page chrome
        fields:
          -
            handle: template
            field:
              type: template
              display: Template
              default: page
              hide: true
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
  seo:
    display: SEO
    sections:
      -
        display: Search and social
        fields:
          -
            import: seo
